name: 每周更新榜单

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ghrank-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USERS_FLOOR: "1000"
      REPOS_FLOOR: "2000"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 取回上一轮快照
        run: |
          mkdir -p data/history
          if git fetch origin snapshots:snapshots 2>/dev/null; then
            git archive snapshots | tar -x -C data/history
            echo "取回快照："
            ls -la data/history
          else
            echo "没有 snapshots 分支，本次按首轮处理，涨跌留空"
          fi

      - name: 抓取并生成榜单
        run: pnpm build

      - name: 存回本轮快照
        run: |
          cd data/history
          git init -q
          git checkout -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%F)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots

      - name: 构建站点
        run: pnpm build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - id: deploy
        uses: actions/deploy-pages@v4
