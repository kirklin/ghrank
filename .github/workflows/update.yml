name: 每周更新榜单

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghrank-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USERS_FLOOR: "1000"
      REPOS_FLOOR: "2000"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 取回上一轮数据
        run: |
          if git fetch origin dataset 2>/dev/null; then
            git show FETCH_HEAD:data.tar.gz > data.tar.gz
            tar xzf data.tar.gz
            rm data.tar.gz
            ls -la data/history
          else
            echo "首轮运行，涨跌留空"
          fi

      - name: 抓取并生成榜单
        run: pnpm fetch:users && pnpm fetch:repos && pnpm snapshot

      - name: 存回本轮数据
        run: |
          tar czf data.tar.gz data
          ls -lh data.tar.gz
          rm -rf .dataset && mkdir .dataset && mv data.tar.gz .dataset/
          cd .dataset
          git init -q
          git checkout -q -b dataset
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dataset $(date -u +%F)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dataset

  publish:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
